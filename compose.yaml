name: iiiu-nav

services:
  app:
    image: ghcr.io/laow99888/iiiu-nav:${IIU_NAV_IMAGE_TAG:-stable}
    build:
      context: .
      args:
        VERSION: ${IIU_NAV_VERSION:-local}
        REVISION: ${IIU_NAV_REVISION:-local}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${IIU_NAV_PORT:-8080}:8080'
    environment:
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      IIU_NAV_ADDR: :8080
      IIU_NAV_TIMEZONE: ${IIU_NAV_TIMEZONE:-Asia/Shanghai}
    secrets:
      - admin-password
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ['CMD', '/iiiu-nav', 'healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

secrets:
  admin-password:
    file: ./secrets/admin-password

volumes:
  data:
    name: ${IIU_NAV_DATA_VOLUME:-iiiu-nav-data}
